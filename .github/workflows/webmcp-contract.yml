name: WebMCP optional adapter contracts
on:
  pull_request:
    paths:
      - 'src/webmcp/**'
      - 'tests/webmcp-contract.test.js'
      - 'tests/webmcp-polyfill-browser.test.mjs'
      - 'tests/webmcp-mv3-browser.test.mjs'
      - '.github/workflows/webmcp-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/webmcp/page-tool-adapter.js
      - run: node --check src/webmcp/tool-schema.js
      - run: node --test tests/webmcp-contract.test.js

  official-polyfill-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned upstream polyfill and Chromium test harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @w3c/webmcp-polyfill@0.1.1 playwright@1.55.0
      - name: Provision Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact versions
        run: npm ls @w3c/webmcp-polyfill playwright --depth=0
      - name: Real secure-localhost browser integration
        run: node --test tests/webmcp-polyfill-browser.test.mjs
      - name: Real isolated Chrome MV3 injection and document identity
        run: node --test tests/webmcp-mv3-browser.test.mjs
