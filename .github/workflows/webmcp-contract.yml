name: WebMCP optional adapter contracts
on:
  pull_request:
    paths:
      - 'src/webmcp/**'
      - 'tests/webmcp-contract.test.js'
      - 'tests/webmcp-polyfill-browser.test.mjs'
      - 'tests/webmcp-mv3-browser.test.mjs'
      - '.github/workflows/webmcp-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/webmcp/page-tool-adapter.js
      - run: node --check src/webmcp/tool-schema.js
      - run: node --test tests/webmcp-contract.test.js

  official-polyfill-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned upstream polyfill and Chromium test harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @w3c/webmcp-polyfill@0.1.1 playwright@1.55.0
      - name: Provision Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact versions
        run: npm ls @w3c/webmcp-polyfill playwright --depth=0
      - name: Real secure-localhost browser integration
        run: node --test tests/webmcp-polyfill-browser.test.mjs
      - name: Real isolated Chrome MV3 injection and document identity
        run: node --test tests/webmcp-mv3-browser.test.mjs

  teavm-real-jso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact reviewed TeaVM PR head
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/teavm
          ref: 86192d9b9cb818f4689bf4f8d9345fefb4019640
          path: teavm
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify pinned TeaVM source identity
        run: |
          test "$(git rev-parse HEAD)" = "86192d9b9cb818f4689bf4f8d9345fefb4019640"
        working-directory: teavm
      - name: Compile actual TeaVM JSO overlays and Checkstyle
        run: ./gradlew --no-daemon --console=plain :jso:apis:compileJava :jso:apis:checkstyleMain
        working-directory: teavm
      - name: Publish forked TeaVM compiler artifacts for independent sample project
        run: ./gradlew --no-daemon --console=plain publishToMavenLocal -x test
        working-directory: teavm
      - name: Generate WebMCP JavaScript fixture and WAR
        run: ./gradlew --no-daemon --console=plain :webmcp:generateJavaScript :webmcp:war
        working-directory: teavm/samples
      - name: Verify non-empty WebMCP JavaScript assets
        run: |
          test -n "$(find teavm/samples/webmcp/build -type f -name '*.js' -print -quit)"
