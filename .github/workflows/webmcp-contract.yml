name: WebMCP optional adapter contracts
on:
  pull_request:
    paths:
      - 'src/webmcp/**'
      - 'tests/webmcp-contract.test.js'
      - 'tests/webmcp-polyfill-browser.test.mjs'
      - 'tests/webmcp-mv3-browser.test.mjs'
      - '.github/workflows/webmcp-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/webmcp/page-tool-adapter.js
      - run: node --check src/webmcp/tool-schema.js
      - run: node --test tests/webmcp-contract.test.js

  official-polyfill-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned upstream polyfill and Chromium test harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @w3c/webmcp-polyfill@0.1.1 playwright@1.55.0
      - name: Provision Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact versions
        run: npm ls @w3c/webmcp-polyfill playwright --depth=0
      - name: Real secure-localhost browser integration
        run: node --test tests/webmcp-polyfill-browser.test.mjs
      - name: Real isolated Chrome MV3 injection and document identity
        run: node --test tests/webmcp-mv3-browser.test.mjs

  teavm-real-jso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact reviewed TeaVM PR head
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/teavm
          ref: c1c41427a57c30d7ab957ea3828a0d1341d9655b
          path: teavm
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify pinned TeaVM source identity
        run: |
          test "$(git rev-parse HEAD)" = "c1c41427a57c30d7ab957ea3828a0d1341d9655b"
        working-directory: teavm
      - name: Compile actual TeaVM JSO overlays and Checkstyle
        run: ./gradlew --no-daemon --console=plain :jso:apis:compileJava :jso:apis:checkstyleMain
        working-directory: teavm
      - name: Publish forked TeaVM compiler artifacts for independent sample project
        run: ./gradlew --no-daemon --console=plain publishToMavenLocal -x test
        working-directory: teavm
      - name: Generate WebMCP JavaScript fixture and WAR
        run: ./gradlew --no-daemon --console=plain :webmcp:generateJavaScript :webmcp:war
        working-directory: teavm/samples
      - name: Verify non-empty WebMCP JavaScript assets
        run: |
          test -n "$(find teavm/samples/webmcp/build -type f -name '*.js' -print -quit)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned polyfill and browser harness for generated Java
        working-directory: teavm
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @w3c/webmcp-polyfill@0.1.1 playwright@1.55.0
      - name: Provision Chromium for compiled-Java browser test
        working-directory: teavm
        run: npx playwright install --with-deps chromium
      - name: Execute compiled TeaVM JavaScript against the official WebMCP polyfill
        working-directory: teavm
        run: node --test samples/webmcp/src/test/browser/runtime.test.mjs

  canonical-recipe-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the exact pinned Java templates and generator only
        shell: bash
        run: |
          set -euo pipefail
          synexia=7a9ead16fdc1a4e62fb5a6bc9aefe8047ec85772
          teavm=c1c41427a57c30d7ab957ea3828a0d1341d9655b
          recipe=proof/synexia/recipes/webmcp-jso-v1
          receiver=proof/teavm/jso/apis/src/main/java/org/teavm/jso/webmcp
          mkdir -p "$recipe/templates" "$receiver"
          get() {
            local url="$1" path="$2" expected="$3" actual
            curl --fail --silent --show-error --location --retry 3 --max-time 30 "$url" -o "$path"
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Source identity mismatch: $path expected $expected got $actual" >&2
              exit 1
            fi
          }
          for name in ModelContext.java WebMcp.java; do
            if [[ "$name" == "ModelContext.java" ]]; then
              hash=65633f53a03bad763fd0283436055e82a63a7c67
            else
              hash=ef7530796ba074995c894cf9695c02d1ba52f991
            fi
            get "https://raw.githubusercontent.com/hsoliwal/com.synexia/$synexia/recipes/webmcp-jso-v1/templates/$name" \
              "$recipe/templates/$name" "$hash"
            get "https://raw.githubusercontent.com/hsoliwal/teavm/$teavm/jso/apis/src/main/java/org/teavm/jso/webmcp/$name" \
              "$receiver/$name" "$hash"
          done
          get "https://raw.githubusercontent.com/hsoliwal/com.synexia/$synexia/recipes/webmcp-jso-v1/generate.mjs" \
            "$recipe/generate.mjs" bf530ab5f878a881066d0f4201e466a0c55ce72e
          get "https://raw.githubusercontent.com/hsoliwal/com.synexia/$synexia/recipes/webmcp-jso-v1/recipe.test.mjs" \
            "$recipe/recipe.test.mjs" 7f7b4ad7f81158fe4edeb720be89dba4f8770605
      - name: Test recipe reproducibility, idempotence and refusal
        run: node --test proof/synexia/recipes/webmcp-jso-v1/recipe.test.mjs
      - name: Verify receiver/template identity without modifying receiver
        run: |
          node proof/synexia/recipes/webmcp-jso-v1/generate.mjs --target proof/teavm --verify > proof/receipt.json
          node -e "const r=require('./proof/receipt.json');if(r.mode!=='verify'||r.results.length!==2||r.results.some(x=>x.state!=='verified'))process.exit(1)"
          cat proof/receipt.json
